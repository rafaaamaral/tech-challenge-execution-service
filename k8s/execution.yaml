apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-config
data:
  MONGODB_CONNECTION_STRING: mongodb://mongo:27017
  MONGODB_DATABASE: execution
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-api
  template:
    metadata:
      labels:
        app: execution-api
    spec:
      containers:
        - name: api
          image: techchallenge-execution:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: execution-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: execution-api
spec:
  selector:
    app: execution-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
